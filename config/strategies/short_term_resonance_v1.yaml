# 短线热点共振 · 初版复刻（V1）
# 与 short_term_resonance 完全相同，唯一区别：关闭“累计涨幅惩罚”
# （cum_return_max_penalty: 0.0），还原候选筛选最初一版的打分行为，用于 A/B 对比。
# 初版（commit fdeeedd）没有累计涨幅惩罚；该惩罚是后来新增的，会把近期已走强的
# 个股往下压，可能拉低短线动量延续的命中率——本变体把它去掉以便横向比较。
id: short_term_resonance_v1
display_name: "短线热点共振 V1（初版·无累计涨幅惩罚）"
scorer: short_term_resonance
schema_version: 1
history_days: 130
max_candidates: 10

weights:
  relative_strength: 0.20
  amount_expansion: 0.20
  trend_structure: 0.15
  turnover_activity: 0.10
  rsi_atr_risk: 0.10
  fund_flow: 0.10
  risk_control: 0.15

# 资金流字段缺失时的降级权重（key 必须是 weights 的子集，去掉 fund_flow）。
