app:
  name: "A股5分钟仓位监控 Web V3.1（AKShare 双数据源容错版）"
  timezone: "Asia/Shanghai"
  schedule_minutes: 5
  run_delay_seconds: 20
  only_trading_session: true
  # 首次使用保持 true：页面可查看提醒预览，但不会真实发送企业微信或短信。
  dry_run: false
  log_level: "INFO"

paths:
  # Excel 用于批量导入；网页新增/编辑后的数据保存到 SQLite。
  positions_file: "data/positions_template.xlsx"
  sqlite_file: "state/stock_monitor.db"
  log_file: "logs/stock_monitor.log"

market:
  # 免费验证阶段：AKShare 读取公开行情页面，无需 Tushare Token。
  # 默认优先新浪；新浪失败后自动回退东方财富，减少东财接口断连对监控的影响。
  provider: "akshare_dual_source"
  frequency: "5分钟"
  period: "5"
  adjust: ""                 # 不复权；用于提醒时避免复权价格与实际成交价混淆
  cached_bars: 80
  primary_source: "sina"     # 可选 sina / eastmoney
  fallback_source: "eastmoney"
  retry_times: 2              # 每个数据源最多尝试次数
  retry_backoff_seconds: 0.8
  bypass_proxy_for_market_hosts: true  # 将行情域名追加到 NO_PROXY；TUN/全局接管仍需代理软件内配置 DIRECT

rules:
  minimum_bars_for_trend: 20
  minimum_bars_for_breakout: 21
  volume_spike_ratio: 1.5
  alert_cooldown_minutes: 30
  # 短信默认仅在高风险信号时发送；企业微信记录全部需要通知的信号。
  sms_levels: ["HIGH"]
  # 技术指标信号阈值
  amount_surge_ratio: 3.0       # 成交额放大倍数触发阈值（最新 / 近20根均值）
  rsi_overbought: 80.0          # RSI 超买提示阈值（仅对有持仓标的触发）
  intraday_atr_multiplier: 1.0  # 盘中单根K线涨跌幅 ≥ ATR/价格 × N 倍时触发强提醒
  daily_return_alert_pct: 0.05  # 日内累计涨跌幅阈值（达到此比例 + 量能放大才触发）

notifications:
  wecom:
    enabled: true
    webhook_env: "WECOM_BOT_WEBHOOK"
    msg_type: "text"      # 企业微信/微信互通群如提示不支持消息类型，请改为 text
    max_markdown_chars: 4000
  aliyun_sms:
    enabled: true
    access_key_id_env: "ALIBABA_CLOUD_ACCESS_KEY_ID"
    access_key_secret_env: "ALIBABA_CLOUD_ACCESS_KEY_SECRET"
    endpoint: "dysmsapi.aliyuncs.com"
    phone_numbers: ""       # 接收手机号，例如 13800138000
    sign_name: ""           # 已审核通过的短信签名
    template_code: ""       # 已审核通过的短信模板 CODE
    # 建议模板内容：股票${stock}触发${signal}，现价${price}元，请查看企业微信详情。

web:
  # 仅本机访问使用 127.0.0.1；局域网电脑/手机访问时改为 0.0.0.0。
  host: "127.0.0.1"
  port: 8501
  auto_start_scheduler: true
  # 设置 MONITOR_WEB_ACCESS_TOKEN 后，网页访问需要输入口令。
  access_token_env: "MONITOR_WEB_ACCESS_TOKEN"
  secret_key_env: "MONITOR_WEB_SECRET_KEY"

hot_sector_monitor:
  enabled: true

  sector_scope:
    types:
      - industry
    top_n_display: 10
    top_n_notify: 3

  schedule:
    close_report_time: "15:10"
    intraday_scan_enabled: false
    intraday_interval_minutes: 5

  candidate:
    max_count_per_sector: 10
    default_strategy: "short_term_resonance"
    available_strategies:
      - "short_term_resonance"
      - "medium_term_quality_value"

  common_risk_filter:
    exclude_st: true
    exclude_suspended: true
    exclude_delisting_risk: true
    exclude_recent_ipo_trading_days: 60
    severe_risk_announcement_days: 30
    sealed_limit_up_as_observe_only: true

  strategy_configs:
    short_term_resonance:
      display_name: "短线热点共振"
      history_days: 130
      max_candidates: 10
      weights:
        relative_strength: 0.20
        amount_expansion: 0.20
        trend_structure: 0.15
        turnover_activity: 0.10
        rsi_atr_risk: 0.10
        fund_flow: 0.10
        risk_control: 0.15
      degraded_weights_no_fund_flow:
        relative_strength: 0.23
        amount_expansion: 0.22
        trend_structure: 0.17
        turnover_activity: 0.11
        rsi_atr_risk: 0.11
        risk_control: 0.16
      thresholds:
        relative_return_weak_below: -2.0
        relative_return_sync_low: -1.0
        relative_return_sync_high: 3.0
        relative_return_extreme_above: 7.0
        amount_ratio_active: 1.0
        amount_ratio_strong: 2.0
        amount_ratio_extreme: 4.0
        rsi_oversold: 30.0
        rsi_hot: 70.0
        rsi_extreme_hot: 80.0
        atr_high_percentile: 80.0
        turnover_high_percentile: 85.0
        limit_up_pct: 9.8
      risk_penalties:
        risk_check_incomplete: 15.0
        announcement_incomplete: 10.0
        abnormal_volatility: 8.0
        lhb: 5.0
        major_reduction: 10.0
        unlock: 10.0
        rsi_extreme_hot: 12.0
        extreme_amount: 8.0
        high_volatility: 8.0
        chasing_risk: 8.0

  sector_filter:
    min_pct_change: 0.0
    min_up_stock_ratio: 0.55

  notification:
    enable_wecom_webhook: true
    send_close_summary: true
    enable_intraday_sector_alert: false
    cooldown_minutes: 30
    prevent_duplicate: true

  http:
    timeout_seconds: 10
    retry_count: 3
    retry_backoff_seconds: [1, 3, 8]

  cache:
    enabled: true
    directory: "./cache/hot_sector"

  report:
    directory: "./reports/hot_sector"
