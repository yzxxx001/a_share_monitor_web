<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 | A股监控</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-page">
  <form class="login-card" method="post">
    <h1>A股监控访问验证</h1>
    <p class="muted">请输入 .env 中配置的 MONITOR_WEB_ACCESS_TOKEN。</p>
    {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
    <input type="password" name="token" required placeholder="访问口令">
    <button class="primary full" type="submit">进入监控面板</button>
  </form>
</body>
</html>
